[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thingsctl"
version = "0.1.5"
description = "Things 3 CLI and local MCP plugin through documented macOS automation"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kian"}]
dependencies = []

[project.scripts]
thingsctl = "thingsctl_pkg.cli:main"

[tool.setuptools.packages.find]
include = ["thingsctl_pkg*"]
